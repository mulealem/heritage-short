[package]
name = "heritage_comic"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.4.2-rc.11", features = ["compile-time-svgtree", "cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.4.2-rc.11", features = ["h264", "libav-agree-gpl"] }

[features]
# 16:9 comic page (the 9:16 layout is the default build)
wide = []

[lib]
name = "heritage_comic"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "heritage_comic"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
